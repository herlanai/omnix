# omnix documentation: build with Hugo and deploy to GitHub Pages.
#
# Build and publish when a push to master changes the site.
# Published site: https://JopenChen.github.io/omnix/
name: Deploy omnix Docs

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml", ".gitmodules"]
  workflow_dispatch:

# Grant permissions to upload and deploy Pages artifacts.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch the Hextra theme submodule.
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Build
        working-directory: site
        run: hugo --minify --baseURL https://JopenChen.github.io/omnix/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://JopenChen.github.io/omnix/
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
