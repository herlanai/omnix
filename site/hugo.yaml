# omnix Hugo documentation configuration using Hextra.
# Publish build output to GitHub Pages: https://JopenChen.github.io/omnix/

# ============================================================================
# Site basics.
# ============================================================================
baseURL: https://JopenChen.github.io/omnix/
title: "omnix"
theme: hextra
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableRobotsTXT: true
enableGitInfo: true
canonifyURLs: true

# ============================================================================
# Languages and per-language navigation menus.
# ============================================================================
languages:
  en:
    label: English
    weight: 1
    title: "omnix — In-process Go reference implementation of the DeepSeek Harness Agent"
    params:
      description: "An in-process Go reference implementation of the DeepSeek Harness Agent — learn how an Agent kernel really works."
    menus:
      main:
        - name: "Docs"
          pageRef: "/en/docs"
          weight: 1
        - name: "Tutorials"
          pageRef: "/en/tutorials"
          weight: 2
        - name: "FAQ"
          pageRef: "/en/faq"
          weight: 3
        - name: "Examples"
          pageRef: "/en/examples"
          weight: 4
        - name: "GitHub"
          url: "https://github.com/herlanai/omnix"
          weight: 5
  zh-cn:
    label: 简体中文
    weight: 2
    title: "omnix — DeepSeek Harness Agent 的 Go 参考实现"
    params:
      description: "进程内 Go 参考实现 — 读懂 Agent 内核"
    menus:
      main:
        - name: "文档"
          pageRef: "/zh-cn/docs"
          weight: 1
        - name: "教程"
          pageRef: "/zh-cn/tutorials"
          weight: 2
        - name: "FAQ"
          pageRef: "/zh-cn/faq"
          weight: 3
        - name: "示例"
          pageRef: "/zh-cn/examples"
          weight: 4
        - name: "GitHub"
          url: "https://github.com/herlanai/omnix"
          weight: 5

# ============================================================================
# Content.
# ============================================================================
# The leaf-bundle directory structure defines sidebar navigation.
disableKinds:
  - taxonomy
  - term
  - rss

# ============================================================================
# Hextra-specific parameters.
# ============================================================================
params:
  # Navigation logo: an AI-generated brand icon based on the README character.
  navbar:
    logo:
      path: "img/omnix-icon.jpg"
      dark: "img/omnix-icon.jpg"
      width: 28
      height: 28
      link: "/"
    displayLogo: true
    displayTitle: true

  # Default dark appearance inspired by DeepSeek Harness glass styling.
  theme:
    default: dark
    displayToggle: true

  # Hextra built-in full-text search.
  search:
    enable: true
    type: flexsearch

  # Footer.
  footer:
    displayPoweredBy: false
    displayCopyright: true
    copyright: "© 2026 omnix — DeepSeek Harness Agent 的 Go 参考实现"

  # Edit links to GitHub source files.
  editURL:
    enable: true
    base: "https://github.com/herlanai/omnix/edit/master/site/content"

  # Syntax highlighting.
  highlight:
    default: true

# ============================================================================
# Syntax highlighting, including Go.
# ============================================================================
markup:
  highlight:
    noClasses: false
    lineNos: true
    lineNumbersInTable: false
  goldmark:
    renderer:
      unsafe: true # Allow raw HTML in content, such as example tables.
